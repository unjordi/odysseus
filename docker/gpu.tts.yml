# docker/gpu.tts.yml — Local TTS sidecar (OpenAI-compatible /v1/audio/speech)
#
# WHY A SIDECAR (and not the in-process "local"/Kokoro provider):
#   The Odysseus image is Python 3.14, but Kokoro (kokoro==0.9.4) declares
#   Requires-Python >=3.10,<3.13 — so the in-container "local" provider CANNOT
#   install and is effectively dead in Docker. Running the TTS engine as its own
#   container sidesteps the Python-version clash AND keeps heavy TTS deps out of
#   the main image. Odysseus talks to it through the built-in "kokoro" TTS
#   provider (OpenAI-compatible /v1/audio/speech at http://tts:8880/v1).
#
# HOW TO USE (CLI overlay pattern, same as docker/gpu.nvidia.yml):
#   export COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml:docker/gpu.tts.yml
#   docker compose up -d
# That's it — TTS works out of the box. Odysseus ships with the built-in
# "kokoro" provider selected by default (Settings → Text to Speech), pointing
# at THIS sidecar over the compose network — NO ModelEndpoint to hand-create.
# Default voice ef_dora (Spanish female); pick any from the dropdown. Override
# the URL with ODYSSEUS_TTS_SIDECAR_URL (default http://tts:8880/v1).
#
# (The "endpoint:<id>" provider still exists for a REMOTE/custom OpenAI-
#  compatible engine: create a Model Endpoint → Base URL http://tts:8880/v1,
#  Model "kokoro", Voice ef_dora, API key blank, then select "<name> (API)".)
#
# DEFAULT ENGINE = Kokoro-FastAPI (Apache-2.0, ~1-2 GB VRAM, streaming, 45 ms
# time-to-first-audio, multilingual incl. Spanish). For MAX Spanish naturalness
# see the commented Chatterbox service at the bottom.

services:
  tts:
    # Imagen CPU por DEFAULT (portable, sin dependencia de GPU). Kokoro es un
    # modelo chico → la síntesis en CPU es perfectamente usable para read-aloud.
    # ⚠️ La imagen GPU (`kokoro-fastapi-gpu:v0.2.4`) trae un PyTorch cuyos kernels
    # NO cubren GPUs muy nuevas: en Blackwell (sm_120, p. ej. RTX 50xx) revienta con
    # "CUDA error: no kernel image is available for execution on the device". Si tu
    # GPU es soportada (Ampere/Ada) puedes volver a la imagen GPU + USE_GPU=true +
    # el bloque `deploy.resources` de abajo. Override: KOKORO_TTS_IMAGE.
    image: ${KOKORO_TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4}
    restart: unless-stopped
    # Odysseus reaches it over the compose network as http://tts:8880. Also
    # exposed on the host loopback so you can probe/curl it directly (harmless;
    # bound to 127.0.0.1 only). Comment out to keep it network-internal.
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      # Kokoro-FastAPI reads its model/voices from its own bundled cache.
      - USE_GPU=false
      # CPU threading. Verified against remsky/Kokoro-FastAPI upstream
      # (docker/cpu/Dockerfile.optimized + api/src/core/config.py, checked
      # 2026-09): the image does NOT expose its own ONNX/thread-count knobs —
      # no ONNX_NUM_THREADS or similar is read by the app. What actually
      # governs its CPU math is the underlying torch/BLAS thread pool, which
      # DOES read these standard env vars at process start. Setting them
      # keeps inference from either (a) defaulting to every host core (noisy
      # neighbor to Odysseus' own container) or (b) defaulting to 1 (needless
      # latency) — tune via KOKORO_CPU_THREADS to match the cores you want to
      # dedicate to TTS.
      - OMP_NUM_THREADS=${KOKORO_CPU_THREADS:-4}
      - MKL_NUM_THREADS=${KOKORO_CPU_THREADS:-4}
      - OPENBLAS_NUM_THREADS=${KOKORO_CPU_THREADS:-4}
    volumes:
      # Persist the downloaded Kokoro weights (~330 MB) across recreates.
      # NAMED volume (not a host bind mount): un bind-mount lo crea docker como
      # root:root → el `appuser` no-root del image NO puede escribir ahí y el
      # download del modelo revienta con PermissionError [Errno 13] en
      # api/src/models/v1_0. El volumen nombrado hereda el ownership del
      # directorio del image en el primer mount → appuser escribe sin choque de UID.
      #
      # DECISIÓN tmpfs-vs-persistente (evaluada, NO cambiada — 2026-09):
      # Kokoro-FastAPI ya hace `initialize_with_warmup()` en su lifespan de
      # arranque (verificado en api/src/main.py upstream) — carga los pesos a
      # RAM del PROCESO en el startup del contenedor, sin importar de qué medio
      # los leyó. Eso significa que la "fluidez" (nada de disco en cada
      # request) ya está resuelta por el propio Kokoro; el named volume solo
      # decide qué tan rápido es ESE único read de arranque. tmpfs ganaría
      # unos ms/segundos de ese read único, a cambio de: (1) perder los ~330MB
      # en cada recreate → re-descarga de HuggingFace (dependencia de red que
      # hoy NO existe) en cada `docker compose up` tras un `down`/rebuild, y
      # (2) reservar esa RAM el 100% del tiempo (incluso con TTS idle) en vez
      # de dejar que sea page-cache reclamable. Con un modelo de 330MB en un
      # volumen local (SSD/NVMe), ese read de arranque ya es sub-segundo — el
      # trade-off no vale la pérdida de persistencia. Se CONSERVA el volumen
      # nombrado. Si unjordi prefiere tmpfs de todos modos (p.ej. host con red
      # muy rápida a HF y RAM sobrada), es un cambio de una línea:
      #   tmpfs: [/app/api/src/models]   # reemplaza el volumes: de abajo
      - tts_models:/app/api/src/models
    # (GPU reservation OMITIDA — imagen CPU. Si vuelves a la imagen GPU en una
    #  arquitectura soportada, re-añade:
    #    deploy: { resources: { reservations: { devices: [{driver: nvidia, count: 1, capabilities: [gpu]}] } } })
    # Memoria: reserva/tope explícitos para que el OS no swappee el proceso ya
    # calentado (el warmup deja los pesos + working set en RAM; sin esto, bajo
    # presión de memoria del host, el kernel puede paginarlo y el próximo
    # request paga esa latencia). ~1-2GB es margen cómodo para Kokoro-82M
    # (pesos ~330MB + runtime PyTorch CPU + buffers de audio). Ajusta si tu
    # host anda muy justo de RAM.
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      # QUÉ SIGNIFICA LISTO PARA EL TTS — y hasta dónde puede llegar un healthcheck honesto.
      #
      # `/health` solo dice "el proceso HTTP contesta". Para Kokoro eso es MENOS de lo que necesitamos:
      # el paquete de voces se carga en el lifespan (`initialize_with_warmup()`), y un contenedor que
      # levantó FastAPI pero no tiene voces es un TTS mudo que se ve sano. Por eso el probe es
      # `/v1/audio/voices` y además EXIGE que la lista NO esté vacía (verificado en vivo: 200, 785 B,
      # 13 ms, ~50 voces, sin síntesis). Es estrictamente más fuerte que `/health` al mismo precio.
      #
      # ⚠️ LO QUE ESTE HEALTHCHECK **NO** PUEDE PROBAR — y hay que decirlo:
      # el fallo de Blackwell (sm_120) que documenta el comentario de la imagen, arriba —
      # "CUDA error: no kernel image is available for execution on the device"— es un fallo de INFERENCIA.
      # Con la imagen GPU en una GPU no soportada, `/health` y `/v1/audio/voices` pueden seguir
      # contestando 200 mientras CADA síntesis revienta: exactamente el "el contenedor está arriba" ≠
      # "el TTS funciona". Distinguirlo exige SINTETIZAR, y sintetizar cada `interval` para siempre es
      # justo lo que un healthcheck no debe hacer (carga el modelo, quema CPU/GPU, escribe audio).
      # ⇒ La distinción se hace UNA vez, no en bucle: `levantar-stack.sh` corre al final un smoke real
      #   de `/v1/audio/speech` (una palabra) y REPORTA si el motor sintetiza de verdad. Ese es el lugar
      #   correcto para un chequeo caro: una vez por despliegue, no cada 30 segundos.
      # (No verificado en esta pasada: no se levantó la imagen GPU — el stack corre la CPU por default.)
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://localhost:8880/v1/audio/voices', timeout=5)); sys.exit(0 if d.get('voices') else 1)"]
      # interval 30s: NADIE depende del TTS (ver el grafo en docs/stack-unificado.md) — su salud es
      # informativa, no gatea el arranque de nadie. No hace falta medirla seguido.
      interval: 30s
      timeout: 10s
      retries: 3
      # 90 s NO es un default: el PRIMER boot descarga los ~330 MB de pesos Kokoro desde HuggingFace
      # (dependencia de red). En los boots siguientes el volumen nombrado `tts_models` ya los tiene y el
      # arranque es una lectura local — el contenedor vivo hoy está `healthy` con esta misma cifra.
      start_period: 90s

volumes:
  # Cache persistente de los pesos Kokoro (~330 MB). Named volume → ownership
  # correcto para el appuser del image (ver nota en el mount de arriba).
  tts_models:

