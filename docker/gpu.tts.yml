# MIT license, dedicated Latin-American Spanish finetune, voice cloning,
# ~6-8 GB VRAM, higher latency than Kokoro. Swap the `tts` service above for
# this one (same Base URL http://tts:8880/v1 → set the port below to 8880),
# or run it as a second sidecar `tts-es` and point a second endpoint at it.
