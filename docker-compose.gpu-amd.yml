# Standalone AMD ROCm GPU Compose file for stack-management UIs (Portainer,
# Coolify, Dockhand, etc.) that accept only a single Compose file and do not
# reliably honor COMPOSE_FILE or multiple `-f` overlays.
#
# This is equivalent to: docker-compose.yml + docker/gpu.amd.yml.
# The base docker-compose.yml plus the docker/gpu.amd.yml overlay remain the
# source of truth — CLI users should keep using the COMPOSE_FILE overlay
# workflow. Keep this file in sync with both when either changes.
#
# Requires ROCm drivers on the host (kfd + DRI devices) and the host user
# running Docker in the `video` and `render` groups. Set RENDER_GID to your
# host's numeric render group id when needed. See docker/gpu.amd.yml for details.
services:
  odysseus:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      # Cookbook remote-server SSH identity. Odysseus can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Odysseus
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${APP_DATA_DIR:-./data}/local:/app/.local:z
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - COMPANION_BASE_URL=${COMPANION_BASE_URL:-}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}
      - ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_MEMORY_IMPORT_MAX_BYTES=${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}
      - ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES=${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_STT_MAX_AUDIO_BYTES=${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}
      - ODYSSEUS_ICS_MAX_BYTES=${ODYSSEUS_ICS_MAX_BYTES:-10485760}
      - ODYSSEUS_TTS_CACHE_MAX_BYTES=${ODYSSEUS_TTS_CACHE_MAX_BYTES}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Externally reachable origin for MCP OAuth callbacks. The container
      # always listens on 7000 and cannot see the host port map above, so
      # remote MCP OAuth needs this set whenever the browser reaches
      # Odysseus on anything other than http://localhost:7000.
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      # QUÉ SIGNIFICA LISTO PARA ODYSSEUS: que uvicorn ya ACEPTA requests. No "que terminó de precargar".
      #   • `GET /` da 302 al login (verificado en vivo) → un healthcheck que exija 200 lo marcaría enfermo
      #     PARA SIEMPRE. Por eso NO se usa la raíz.
      #   • `/api/health` está en AUTH_EXEMPT_EXACT (app.py) → responde 200 SIN sesión, y solo devuelve un
      #     dict con timestamp: cero I/O, cero DB, cero red. Es el probe barato que se puede repetir para siempre.
      #   • `/api/ready` (app.py) es la readiness REAL (DB + data dir) y sería más rico… pero NO sirve aquí:
      #     está detrás del middleware de auth (devuelve 401, verificado) y además ESCRIBE un archivo probe en
      #     data/ en cada llamada. Un healthcheck no escribe. Se usa UNA vez, a mano, no cada `interval`.
      #   • Las precargas pesadas (Whisper large-v3, servidores MCP) corren en `asyncio.to_thread` como tareas
      #     de arranque (app.py:1092) → NO bloquean el event loop: /api/health responde mientras cargan. Por eso
      #     "listo" = sirve HTTP, y la precarga es un WARMUP, no una condición de readiness.
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:7000/api/health"]
      # interval 5s: axon ESPERA a que odysseus esté healthy → cada segundo de detección es un segundo de
      # arranque del stack. Barato (una request local sin I/O), así que se mide seguido.
      interval: 5s
      timeout: 8s          # > el --max-time 5 del curl, para que el timeout que mande sea el del curl
      retries: 5           # tras el start_period: 5 fallos × 5s = 25s de gracia antes de declararlo enfermo
      # start_period MEDIDO, no un 30 por default: arranque tibio 2026-09-07 → contenedor 18:50:22.709,
      # "Uvicorn running on http://0.0.0.0:7000" 18:50:26.202 = 3.5 s. Los 60 s son para el arranque FRÍO
      # (imagen recién construida, page cache vacío, FastEmbed + los round-trips a chromadb). Un start_period
      # generoso NO cuesta nada cuando el arranque es rápido: el PRIMER probe exitoso marca healthy de
      # inmediato; lo único que hace es no contar fallos mientras el servicio todavía está naciendo.
      start_period: 60s
    depends_on:
      # ── searxng: service_HEALTHY (arista dura, PRE-EXISTENTE — se conserva con su razón) ──────────
      # La búsqueda es funcionalidad de primera clase de la app y searxng tiene un modo de fallo
      # documentado en este mismo archivo: la tag upstream 2026.6.2 CRASHEA al boot
      # (`KeyError: 'default_doi_resolver'`). "Arriba" no distingue eso de "sirviendo"; "healthy" sí.
      # Precio aceptado: un searxng que nunca sana bloquea a Odysseus. Es deliberado, no un descuido.
      searxng:
        condition: service_healthy
      # ── chromadb: service_STARTED (NO healthy — a propósito) ──────────────────────────────────────
      # Tentador subirlo a `healthy` ahora que chromadb SÍ tiene healthcheck… y sería un `depends_on` de
      # más. `src/rag_singleton.py` es un inicializador LAZY CON REINTENTO ("Returns the VectorRAG
      # instance on first successful init, None if ChromaDB unavailable… retries per _RETRY_INTERVAL"):
      # la carrera se CURA SOLA. Exigir `healthy` cambiaría un degradado temporal y auto-reparable por
      # un SPOF: chromadb enfermo ⇒ Odysseus NO arranca, ni siquiera las 9/10 partes de la app que no
      # tocan RAG. `started` deja el ORDEN bonito sin comprar ese riesgo.
      chromadb:
        condition: service_started
    restart: unless-stopped
    # AMD ROCm overlay (from docker/gpu.amd.yml).
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      # QUÉ SIGNIFICA LISTO PARA CHROMADB: que su endpoint de heartbeat contesta — es el mismo que Odysseus
      # consulta al arrancar (`GET /api/v2/heartbeat`, visto en sus logs). "Contenedor arriba" no basta:
      # el proceso tarda en aceptar conexiones y ahí es donde vive la carrera.
      # POR QUÉ ESTE COMANDO Y NO UN curl: la imagen `chromadb/chroma` NO trae curl, wget, nc NI python
      # (verificado dentro del contenedor vivo) — solo bash 5.2. `/dev/tcp` es una feature de BASH, no de sh:
      # el `sh` de esta imagen es dash y falla con "cannot create /dev/tcp/..." → por eso es
      # ["CMD","bash","-c",…] y NO CMD-SHELL (CMD-SHELL invoca /bin/sh = dash). Verificado exit=0 en vivo.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3; grep -q 'nanosecond heartbeat' <&3"]
      interval: 5s         # odysseus lo espera en el orden de arranque → detección rápida
      timeout: 5s
      retries: 5
      # NO MEDIDO (no se reinició nada en esta pasada): chroma arranca en segundos, pero 30 s es el margen
      # honesto para un cold start con el sqlite ya poblado. Ajústalo con evidencia en el primer `up` real.
      start_period: 30s
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — odysseus waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # MARCA DE VERSIÓN de la plantilla. Tiene que ser IDÉNTICA a la línea
        # `odysseus-searxng-config:` de config/searxng/settings.yml. Mientras el archivo que ya vive
        # en el volumen no la traiga, se RESIEMBRA desde la plantilla.
        #
        # POR QUÉ: /etc/searxng es un volumen con nombre (`searxng-data`) y ES la config efectiva. El
        # `if` de antes solo sembraba cuando el archivo estaba vacío o todavía tenía el placeholder del
        # secreto — o sea, la PRIMERA vez. Después de eso, editar config/searxng/settings.yml no tenía
        # NINGÚN efecto: el volumen se quedaba con la config vieja para siempre. Fue justo lo que dejó
        # a la instancia con el set de motores de fábrica (google/duckduckgo/brave/startpage, los cuatro
        # bloqueados desde esta IP) devolviendo 200 con cero resultados.
        #
        # Como esta marca vive en el `entrypoint`, cambiarla también cambia la config del servicio, así
        # que el siguiente `docker compose up -d` RECREA searxng solo — no hace falta ningún paso manual
        # ni tocar el volumen a mano.
        marca='odysseus-searxng-config: 2026-09-07-motores'
        resembrar=0
        [ -s /etc/searxng/settings.yml ] || resembrar=1
        if [ "$$resembrar" = 0 ] && grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          resembrar=1
        fi
        if [ "$$resembrar" = 0 ] && ! grep -qF "$$marca" /etc/searxng/settings.yml; then
          resembrar=1
        fi
        if [ "$$resembrar" = 1 ]; then
          secret="$${SEARXNG_SECRET:-}"
          # Un resiembre NO rota el secreto: se reusa el que ya está en el volumen. Rotarlo invalidaría
          # las preferencias firmadas de quien ya venía usando la instancia, y no hay motivo para pagar
          # eso solo porque cambió la lista de motores.
          if [ -z "$$secret" ] && [ -s /etc/searxng/settings.yml ]; then
            secret="$$(sed -n 's/^ *secret_key: *//p' /etc/searxng/settings.yml | head -n1 | tr -d '"')"
            if [ "$$secret" = '__SEARXNG_SECRET__' ]; then secret=''; fi
          fi
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          # Nada se pierde en el camino: lo que hubiera queda al lado antes de sobrescribir. SearXNG
          # solo lee `settings.yml` de esta carpeta, así que un `settings.yml.previo-…` no le estorba.
          if [ -s /etc/searxng/settings.yml ]; then
            cp /etc/searxng/settings.yml "/etc/searxng/settings.yml.previo-$$(date +%Y%m%d%H%M%S)"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        # Advisory: a settings file the migration cannot parse or rewrite must
        # not be what stops searxng from booting. It explains itself on stderr
        # and we carry on, letting searxng report anything genuinely wrong.
        /usr/local/searxng/.venv/bin/python /tmp/migrate-searxng-settings.py /etc/searxng/settings.yml || true
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
      - ./scripts/migrate_searxng_settings.py:/tmp/migrate-searxng-settings.py:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    healthcheck:
      # QUÉ SIGNIFICA LISTO PARA NTFY: su propio `/v1/health` devuelve {"healthy":true} (verificado en vivo).
      # Se comprueba el CONTENIDO, no solo el código: ntfy responde 200 a rutas que no prueban nada.
      # La imagen es Alpine/busybox → trae wget (no curl); `grep -q` sobre el JSON es todo lo que hace falta.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/v1/health | grep -q '\"healthy\":true'"]
      # interval 30s: NADIE depende de ntfy (ver el grafo en docs/stack-unificado.md). Su healthcheck existe
      # para que `docker compose ps` diga la verdad, no para desbloquear a otro servicio → no urge medirlo seguido.
      interval: 30s
      timeout: 5s
      retries: 3
      # ntfy es un binario Go que sirve casi de inmediato; 10 s es margen de sobra y no gatea a nadie.
      start_period: 10s
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
